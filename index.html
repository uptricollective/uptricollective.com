<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPTRI &mdash; Built to Hold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #FAF9F6;
    color: #111;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 32px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #111;
    opacity: 0.9;
  }
  header .mark { font-weight: 600; letter-spacing: 0.18em; }
  header .contact-top { font-weight: 400; opacity: 0.6; }
  header .contact-top a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
  header .contact-top a:hover { border-bottom-color: #111; opacity: 1; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 40px 32px 80px;
    text-align: center;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(26px, 4.2vw, 44px);
    font-weight: 400;
    line-height: 1.25;
    max-width: 720px;
    letter-spacing: -0.02em;
    color: #111;
  }
  .divider {
    width: 28px;
    height: 1px;
    background: #111;
    opacity: 0.2;
    margin: 36px auto;
  }
  .email {
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #111;
    opacity: 0.7;
  }
  .email a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(17,17,17,0.25);
    padding-bottom: 2px;
    transition: all 0.2s ease;
  }
  .email a:hover {
    opacity: 1;
    border-bottom-color: #111;
  }
  footer {
    padding: 24px 40px 32px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #999;
  }
  @media (max-width: 600px) {
    header { padding: 24px 20px; }
    footer { padding: 20px; }
  }
</style>
</head>
<body>
  <header>
    <div class="mark">UPTRI</div>
    <div class="contact-top"><a href="mailto:inquiry@domain.com">inquiry@uptricollective.com</a></div>
  </header>

  <main>
    <h1>Built to hold.</h1>
  </main>

  <footer>&copy; 2026 UPTRI COLLECTIVE</footer>
</body>
</html>
